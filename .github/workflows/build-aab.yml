name: Build AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setupgradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew bundleRelease
      - uses: actions/uploadartifact@v4
        with:
          name: aabpath:app/build/outputs/bundle/release/b
